plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    defaultConfig {
        Properties properties = new Properties()
        def localProperties = project.rootProject.file('local.properties')
        if (localProperties.exists()) {
            properties.load(localProperties.newDataInputStream())
        }
        manifestPlaceholders = [GEO_MAP_API_KEY: properties.getProperty('GEO_MAP_API_KEY', '')]
        buildConfigField "String", "FLASK_SERVER_URL", '"' + properties.getProperty('FLASK_SERVER_URL', 'https://docker-python3-opencv-uvbeppe6ea-el.a.run.app') + '"'
        applicationId "com.example.smart_rice_care"
        minSdkVersion 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        //applicationId "opencv.org"


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
    packagingOptions {
        resources.excludes.add("META-INF/*")
    }
}
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.maps.android:android-maps-utils:3.19.0'
    implementation 'org.jetbrains:annotations:15.0'
    implementation 'com.google.firebase:firebase-auth'
//    implementation project(path: ':sdk')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation("com.squareup.okhttp3:okhttp:4.9.0")

    def cameraxVersion = "1.7.0"
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"
    implementation "org.apache.httpcomponents:httpmime:4.3"
    implementation "com.loopj.android:android-async-http:1.4.9"
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation "com.google.android.gms:play-services-location:21.3.0"


    implementation fileTree(dir: 'libs', include: ['*.jar'])

}
